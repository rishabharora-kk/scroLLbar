name: Validate scrollbar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript for declaration checking
        run: npm install --no-save --ignore-scripts typescript@5
      - name: Unit tests, TS declaration consumer and JS syntax
        run: npm run check
      - name: Check demo paths
        run: |
          test -f index.html
          test -f demo/index.html
          test -f src/core.mjs
